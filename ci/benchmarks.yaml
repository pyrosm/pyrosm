# Conda environment for running the pyrosm benchmarks
# (docs/benchmarks/benchmarks_scaling.ipynb + the companion
# docs/benchmarks/osmextract_benchmark_scaling.ipynb).
#
# Holds the released pyrosm (the wheel from PyPI) with its dependencies, the tools pyrosm is
# benchmarked against at pinned versions (OSMnx, QuackOSM, pyosmium, osmium-tool, and the Java
# runtime for Osmosis), the notebook and plotting packages, and the R stack for osmextract.
# Osmosis and osmextract are installed after the environment exists:
#
#   mamba env create -f ci/benchmarks.yaml
#   mamba activate pyrosm-benchmarks
#   # Osmosis 0.49.2: https://github.com/openstreetmap/osmosis/releases (put `osmosis` on PATH)
#   R -e 'remotes::install_version("osmextract", version = "0.6.0", repos = "https://cloud.r-project.org")'
#   R -e 'IRkernel::installspec()'        # register the R kernel for Jupyter
#
name: pyrosm-benchmarks

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  # === pyrosm's dependencies (pyrosm itself is installed from PyPI below) ===
  - cykhash>=2
  - geopandas>=0.12.0
  - shapely>=2.1
  - protobuf>=6.33.5
  - python-rapidjson
  - tqdm>=4.66
  - certifi
  - pyarrow
  # === the tools pyrosm is benchmarked against ===
  - osmnx=2.1.1
  - quackosm=0.19.0
  - pyosmium=4.3.1
  - osmium-tool=1.19.1
  - openjdk            # Java runtime for Osmosis (download the Osmosis launcher separately)
  # === benchmark notebook packages (Jupyter, plotting, data frames, process memory) ===
  - jupyterlab
  - notebook
  - ipykernel
  - ipywidgets
  - matplotlib
  - pandas
  - numpy
  - psutil
  # === R stack for the osmextract companion notebook ===
  # (r-sf brings its own GDAL/GEOS/PROJ; conda-forge normally shares these with
  #  geopandas, but if the solver fights, install R in a separate env instead.)
  - r-base
  - r-sf
  - r-irkernel
  - r-remotes
  - r-jsonlite
  - pip:
      - pyrosm==0.19.1
